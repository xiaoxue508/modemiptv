# modemiptv / iptvd config — ZTE ZX279511 ONU (kernel 3.4, armv7 no-VFP)
# key=value, inline comments after " #"

# ---- platform identity (from the router deployment, unchanged) ----
eas_host=124.132.240.38
epg_host=60.212.113.86
userid=053502686836
stbid=000004370020A32000EF6CEFC689337E
stbmac=6C:EF:C6:89:33:7E
auth_key=68682600
stbtype=S-010W-AV2A
stbversion=S-010W-AV2A_SW_SD_A_R2.03.19

# ---- uplink: bind platform traffic to the IPTV IPoE connection ----
# nbif1 carries 10.156.31.108/22 (gw 10.156.28.1). No route/program needed:
# rule 20014 "from 10.156.31.108 lookup table.IGD.WD1.WCD4.WCIP1" plus the
# carrier table (default + all IPTV prefixes via 10.156.28.1) is cspd-owned.
upstream_interface=nbif1
stbip=auto
uplink_policy=0

# ---- paths ----
data_dir=/userconfig/iptv
cache_dir=/tmp/iptvd

# ---- endpoints ----
port=5150
r2h=http://192.168.123.1:5141
m3u_epg_url=http://192.168.1.1:5150/epg.xml
bridge_tpl=http://192.168.1.1:5150/c?ch={uid}&s=${(b)yyyyMMddHHmmss}&u=${timestamp}
gen_url=http://192.168.1.1:5150
